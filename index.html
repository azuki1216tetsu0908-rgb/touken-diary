<style>
:root{--ink:#20252b;--muted:#747b83;--paper:#fbfaf6;--card:#fff;--line:#e5e1d8;--navy:#172536;--pink:#b87886;--green:#5f8b76;--red:#b55f65;--shadow:0 5px 20px rgba(25,34,45,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f5f2eb,#fbfaf6 45%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:84px}
header{padding:22px 18px 12px;position:sticky;top:0;z-index:5;background:rgba(251,250,246,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(229,225,216,.7)}

.search{margin-bottom:10px}.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}.sakura{color:var(--pink)}.right{margin-left:auto}.fav{color:#c58a28}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:right}.table th:first-child,.table td:first-child{text-align:left}.chart{height:190px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fcfbf8}.chart svg{width:100%;height:100%}.notice{font-size:11px;color:var(--muted);line-height:1.7}

<script>
const KEY="toukenDiary_v1";
const empty={resources:[],swords:[],levels:[],memos:[],settings:{theme:"light"}};
const MASTER_SWORDS=["今剣", "平野藤四郎", "厚藤四郎", "後藤藤四郎", "信濃藤四郎", "前田藤四郎", "秋田藤四郎", "博多藤四郎", "乱藤四郎", "五虎退", "薬研藤四郎", "包丁藤四郎", "愛染国俊", "太鼓鐘貞宗", "小夜左文字", "不動行光", "毛利藤四郎", "謙信景光", "日向正宗", "北谷菜切", "太閤左文字", "京極正宗", "九鬼正宗", "倶利伽羅江", "にっかり青江", "鯰尾藤四郎", "骨喰藤四郎", "物吉貞宗", "堀川国広", "浦島虎徹", "篭手切江", "肥前忠広", "治金丸", "泛塵", "火車切", "鳴狐", "千子村正", "亀甲貞宗", "宗三左文字", "加州清光", "大和守安定", "歌仙兼定", "和泉守兼定", "陸奥守吉行", "山姥切国広", "蜂須賀虎徹", "長曽祢虎徹", "大倶利伽羅", "へし切長谷部", "同田貫正国", "南泉一文字", "山姥切長義", "豊前江", "南海太郎朝尊", "桑名江", "水心子正秀", "源清麿", "松井江", "地蔵行平", "五月雨江", "村雲江", "稲葉江", "石田正宗", "孫六兼元", "後家兼光", "富田江", "大慶直胤", "安宅切", "二筋樋貞宗", "雲重", "童子切安綱 剥落", "三日月宗近", "小狐丸", "大典太光世", "ソハヤノツルキ", "数珠丸恒次", "鬼丸国綱", "一期一振", "大包平", "鶯丸", "明石国行", "燭台切光忠", "大般若長光", "小竜景光", "江雪左文字", "山伏国広", "髭切", "膝丸", "獅子王", "小烏丸", "抜丸", "鶴丸国永", "小豆長光", "千代金丸", "山鳥毛", "古今伝授の太刀", "日光一文字", "一文字則宗", "姫鶴一文字", "福島光忠", "笹貫", "八丁念仏", "実休光忠", "雲生", "道誉一文字", "雲次", "面影", "古備前信房", "三郎国宗", "波平行安", "狐ヶ崎為次", "石切丸", "蛍丸", "太郎太刀", "次郎太刀", "祢々切丸", "柏太刀", "蜻蛉切", "日本号", "御手杵", "大千鳥十文字槍", "人間無骨", "岩融", "巴形薙刀", "静形薙刀", "白山吉光", "七星剣", "丙子椒林剣"];
let db=load(); let currentPage="home"; let resourceMode="list"; let editingSword=null;
function load(){try{const x={...empty,...JSON.parse(localStorage.getItem(KEY)||"{}")};x.resources=(x.resources||[]).map(r=>({...r,koushu:r.koushu??"",koban:r.koban??""}));return x}catch(e){return {...empty}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db)); renderAll()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(n){return Number(n||0).toLocaleString("ja-JP")}
function today(){return new Date().toISOString().slice(0,10)}
function jpDate(d){return new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",weekday:"short"})}
function deltaClass(n){return n>0?"up":n<0?"down":"flat"}
function resDelta(r,prev){if(!prev)return null;return ["wood","steel","cool","stone","koushu","koban"].map(k=>Number(r[k]||0)-Number(prev[k]||0))}
function latestResource(){return [...db.resources].sort((a,b)=>b.date.localeCompare(a.date))[0]}
function latestResBefore(date){return [...db.resources].filter(r=>r.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function todayLevels(){return db.levels.filter(x=>x.date===today())}
function swordName(id){return db.swords.find(s=>s.id===id)?.name||"不明"}
function renderHome(){
 const r=latestResource(), prev=r&&latestResBefore(r.date), ds=r&&resDelta(r,prev);
 const lv=todayLevels();
 document.getElementById("home").innerHTML=`
 <div class="hero"><div class="date">${jpDate(today())}</div><h1>今日も、よく頑張りました。</h1><p>資材と男士の歩みを、ひとつずつ残していこう。</p></div>
 <div class="card"><div class="row"><h2>本日の資材</h2><button class="btn icon" onclick="showPage('resources');setTimeout(()=>openResourceForm(),50)">＋記録</button></div>
 ${r?resourceCards(r,ds):'<div class="empty">まだ資材記録がありません。<br>最初の記録をつけてみよう。</div>'}</div>
 <div class="card"><div class="row"><h2>本日のLvUP</h2><span class="muted">${lv.length}件</span></div>
 ${lv.length?'<div class="list">'+lv.map(x=>`<div class="item"><div class="row"><b>${esc(swordName(x.swordId))}</b><span class="pill">Lv.${x.level}</span></div><div class="muted">${esc(x.note||"")}</div></div>`).join('')+'</div>':'<div class="empty">今日のLv記録はまだありません。</div>'}</div>
 <div class="card"><h2>記録サマリー</h2><div class="grid4">
 <div class="resource"><div class="label">男士</div><div class="num">${db.swords.length}</div></div>
 <div class="resource"><div class="label">Lv記録</div><div class="num">${db.levels.length}</div></div>
 <div class="resource"><div class="label">資材日数</div><div class="num">${db.resources.length}</div></div>
 <div class="resource"><div class="label">お迎え</div><div class="num">${db.swords.filter(s=>s.acquired).length}</div></div>
 </div></div>`;
}
function resourceCards(r,ds){
 const names=[["wood","木炭"],["steel","玉鋼"],["cool","冷却材"],["stone","砥石"],["koushu","甲州金"],["koban","小判"]];
 return '<div class="grid4">'+names.map(([k,n],i)=>`<div class="resource"><div class="label">${n}</div><div class="num">${fmt(r[k])}</div>${ds?`<div class="delta ${deltaClass(ds[i])}">${ds[i]>0?"+":""}${fmt(ds[i])}</div>`:""}</div>`).join('')+'</div><div class="muted" style="margin-top:9px">記録日：${esc(r.date)}${r.note?"　・ "+esc(r.note):""}</div>';
}
function renderResources(){
 const sorted=[...db.resources].sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById("resources").innerHTML=`
 <div class="row"><div><h1 style="font-family:'Hiragino Mincho ProN','Yu Mincho',serif;font-size:23px;margin:0">資材記録</h1><div class="muted">スクショ2枚から6つの資源を自動読み取りできます。</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><label class="btn" style="white-space:nowrap">📸 資材読取<input id="resourceShotInput" type="file" accept="image/*" onchange="readResourceScreenshot(event)" style="display:none"></label><label class="btn" style="white-space:nowrap">📸 小判読取<input id="kobanShotInput" type="file" accept="image/*" onchange="readKobanScreenshot(event)" style="display:none"></label><button class="btn secondary" onclick="openResourceForm()">＋手入力</button></div></div>
 <div class="tabs" style="margin-top:13px"><button class="${resourceMode==='list'?'active':''}" onclick="resourceMode='list';renderResources()">一覧</button><button class="${resourceMode==='chart'?'active':''}" onclick="resourceMode='chart';renderResources()">グラフ</button></div>
 ${resourceMode==='chart'?resourceChart(sorted):`<div class="card"><div class="notice">前回の記録がある日は、増減も自動計算します。</div></div>
 <div class="list">${sorted.length?sorted.map((r,i)=>{let p=latestResBefore(r.date),d=resDelta(r,p);return `<div class="item"><div class="row"><b>${esc(r.date)}</b><button class="btn secondary icon" onclick="editResource('${r.id}')">編集</button></div>${resourceCards(r,d)}</div>`}).join(""):'<div class="empty">記録がありません。</div>'}</div>`}`;
}
function resourceChart(arr){
 if(arr.length<2)return '<div class="card"><div class="empty">グラフには2日以上の資材記録が必要です。</div></div>';
 const data=arr.slice().reverse().slice(-30), W=700,H=180,p=24, keys=["wood","steel","cool","stone","koushu","koban"], max=Math.max(...data.flatMap(x=>keys.map(k=>+x[k]||0))), min=Math.min(...data.flatMap(x=>keys.map(k=>+x[k]||0))), range=max-min||1;
 const pts=k=>data.map((x,i)=>`${p+i*(W-2*p)/(data.length-1)},${H-p-((x[k]-min)/range)*(H-2*p)}`).join(" ");
 return `<div class="card"><div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="#ddd"/><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#ddd"/><polyline points="${pts("wood")}" fill="none" stroke="#333" stroke-width="3"/><polyline points="${pts("steel")}" fill="none" stroke="#b87886" stroke-width="3"/><polyline points="${pts("cool")}" fill="none" stroke="#5f8b76" stroke-width="3"/><polyline points="${pts("stone")}" fill="none" stroke="#6e82a0" stroke-width="3"/><polyline points="${pts("koushu")}" fill="none" stroke="#c58a28" stroke-width="3"/><polyline points="${pts("koban")}" fill="none" stroke="#8b5a2b" stroke-width="3"/></svg></div><div class="small" style="margin-top:8px">━ 木炭　━ 玉鋼　━ 冷却材　━ 砥石　━ 甲州金　━ 小判</div><div class="muted">${data[0].date} ～ ${data[data.length-1].date}</div></div>`;
}

async function readResourceScreenshot(event){
 const file=event.target.files?.[0]; if(!file)return;
 const wrap=document.createElement("div"); wrap.id="ocrProgress"; wrap.className="card";
 wrap.innerHTML='<h2>📸 資材・甲州金を読み取り中…</h2><div class="notice">上部バーの木炭・玉鋼・冷却材・砥石・甲州金を読み取ります。6桁・7桁どちらにも対応しています。</div><div id="ocrStatus" class="muted" style="margin-top:8px">準備中…</div>';
 document.getElementById("resources").prepend(wrap);
 try{
   const img=await loadImage(file);
   const src=normalizeLandscape(img);
   document.getElementById("ocrStatus").textContent="上部バーを解析中…";

   // 実際の刀剣乱舞ホーム画面（1334×750）を基準にした数値部分。
   // v13では玉鋼以降のX位置が右にずれており、数字の先頭を切ってしまう場合があった。
   // ここでは各枠を少し広めに取り、6桁・7桁を許容する。
   const boxes=[
     [0.300,0.010,0.080,0.072,"木炭",6,7],
     [0.388,0.010,0.098,0.072,"玉鋼",6,7],
     [0.490,0.010,0.098,0.072,"冷却材",6,7],
     [0.605,0.010,0.100,0.072,"砥石",6,7],
     [0.715,0.010,0.055,0.072,"甲州金",1,3]
   ];
   const vals=[];
   for(const [rx,ry,rw,rh,name,minLen,maxLen] of boxes){
     document.getElementById("ocrStatus").textContent=`${name}を読み取り中…`;
     vals.push(await readNumberCropFlexible(src,rx,ry,rw,rh,minLen,maxLen,name));
   }

   wrap.remove();
   openResourceForm({date:today(),wood:vals[0]||"",steel:vals[1]||"",cool:vals[2]||"",stone:vals[3]||"",koushu:vals[4]||"",koban:"",note:"スクショから読み取り（資材・甲州金）"});
   const notice=document.createElement("div"); notice.className="card"; notice.innerHTML='<b>📸 読み取り結果を確認してください</b><div class="notice">6桁・7桁の資材と甲州金を読み取っています。OCRは誤認識することがあるので、保存前に数字を確認・修正できます。</div>';
   document.getElementById("resourceForm").prepend(notice);
 }catch(e){
   console.error(e);
   wrap.innerHTML='<h2>読み取りできませんでした</h2><div class="notice">画像を確認できませんでした。もう一度試すか、＋手入力をご利用ください。</div>';
 }
 event.target.value="";
}

function normalizeLandscape(img){
  if(img.width>=img.height) return img;
  const c=document.createElement("canvas"); c.width=img.height; c.height=img.width;
  const ctx=c.getContext("2d");
  ctx.translate(c.width,0); ctx.rotate(Math.PI/2); ctx.drawImage(img,0,0);
  return c;
}

async function readNumberCropFlexible(img,rx,ry,rw,rh,minLen,maxLen,name){
 const scale=6;
 const sx=Math.round(img.width*rx), sy=Math.round(img.height*ry);
 const sw=Math.round(img.width*rw), sh=Math.round(img.height*rh);
 let best="", bestScore=-Infinity;
 // 同じ枠でも少しずつ左右をずらして、端の数字が切れないようにする。
 const xOffsets=[-0.015,0,0.015];
 for(const off of xOffsets){
   const x=Math.max(0,Math.min(img.width-1,sx+Math.round(img.width*off)));
   const w=Math.min(img.width-x,sw);
   const c=document.createElement("canvas"); c.width=w*scale; c.height=sh*scale;
   const ctx=c.getContext("2d"); ctx.imageSmoothingEnabled=true;
   ctx.drawImage(img,x,sy,w,sh,0,0,c.width,c.height);
   const base=ctx.getImageData(0,0,c.width,c.height);
   const variants=[];
   for(const threshold of [125,150,175,200]){
     const v=new ImageData(new Uint8ClampedArray(base.data),base.width,base.height), d=v.data;
     for(let i=0;i<d.length;i+=4){
       const g=.299*d[i]+.587*d[i+1]+.114*d[i+2]; const b=g>threshold?255:0;
       d[i]=d[i+1]=d[i+2]=b; d[i+3]=255;
     }
     const cc=document.createElement("canvas"); cc.width=v.width; cc.height=v.height; cc.getContext("2d").putImageData(v,0,0); variants.push(cc);
   }
   for(const cc of variants){
     for(const psm of [7,8,13]){
       const result=await Tesseract.recognize(cc,"eng",{
         logger:m=>{if(m.status==="recognizing text"){const el=document.getElementById("ocrStatus")||document.getElementById("kobanOcrStatus");if(el)el.textContent=`${name}を読み取り中… ${Math.round((m.progress||0)*100)}%`; }},
         tessedit_pageseg_mode:String(psm),
         tessedit_char_whitelist:"0123456789, "
       });
       const text=result.data.text||"";
       const candidates=[...text.matchAll(/\d[\d,\s]{0,15}/g)].map(m=>m[0].replace(/[^0-9]/g,""));
       for(let val of candidates){
         if(!val) continue;
         // 連続して拾った数字が長すぎる場合、枠内で成立する末尾/先頭候補を試す。
         const tries=[val];
         if(val.length>maxLen){
           for(let n=minLen;n<=maxLen;n++){
             tries.push(val.slice(0,n),val.slice(-n));
           }
         }
         for(const cand of tries){
           if(cand.length<minLen || cand.length>maxLen) continue;
           let score=0;
           if(cand.length===6) score+=70;
           if(cand.length===7) score+=85;
           if(minLen<=1 && maxLen===3) score=100-cand.length; // 甲州金は短い数字を優先
           // カンマ付きの数字をTesseractが認識できた候補は少し加点。
           if(/[\d],[\d]/.test(text)) score+=5;
           // OCRの信頼度が取れる場合も利用する。
           if(typeof result.data.confidence==="number") score+=result.data.confidence/10;
           if(score>bestScore){bestScore=score;best=cand;}
         }
       }
     }
   }
 }
 return best;
}

async function readLevelScreenshot(event){
 const file=event.target.files?.[0]; if(!file)return;
 const wrap=document.createElement("div"); wrap.id="lvOcrProgress"; wrap.className="card";
 wrap.innerHTML='<h2>📸 Lvを読み取り中…</h2><div class="notice">部隊一覧の各行から「男士名」と「Lv」を読み取っています。初回はOCRエンジンの準備に少し時間がかかります。</div><div id="lvOcrStatus" class="muted" style="margin-top:8px">準備中…</div>';
 document.getElementById("swords").prepend(wrap);
 try{
   const img=await loadImage(file);
   // The supplied Touken Ranbu screenshot has six roster rows in the left half.
   // These proportional crops intentionally leave out portraits/icons and the right-side character.
   const rows=[.165,.293,.422,.551,.680,.809];
   const results=[];
   for(let i=0;i<rows.length;i++){
     const y=rows[i];
     const c=document.createElement("canvas");
     c.width=Math.round(img.width*.39); c.height=Math.round(img.height*.115);
     const ctx=c.getContext("2d");
     ctx.drawImage(img,Math.round(img.width*.055),Math.round(img.height*(y-.025)),c.width,c.height,0,0,c.width,c.height);
     document.getElementById("lvOcrStatus").textContent=`${i+1}/6人目を読み取り中…`;
     const result=await Tesseract.recognize(c,"jpn+eng",{logger:m=>{}});
     const text=result.data.text.replace(/\n+/g," ").trim();
     const nums=[...text.matchAll(/(?:Lv\.?|LV\.?)\s*([0-9]{1,3})/gi)].map(m=>m[1]);
     let level=nums.length?Number(nums[0]):null;
     if(level===null){
       const all=[...text.matchAll(/\b([0-9]{1,3})\b/g)].map(m=>Number(m[1])).filter(n=>n>=1&&n<=255);
       level=all.find(n=>n>=40)??all[0]??null;
     }
     // Try to extract the Japanese name from text. The name is usually before "Lv".
     let name=text.split(/Lv\.?|LV\.?/i)[0].replace(/[^一-龯ぁ-んァ-ヶー々ゝゞ・a-zA-Z]/g,"").trim();
     if(!name) name="";
     results.push({name,level,text});
   }
   wrap.remove();
   openLevelOcrConfirm(results);
 }catch(e){
   wrap.innerHTML='<h2>読み取りできませんでした</h2><div class="notice">この画像から自動判定できませんでした。別のスクショを試すか、手入力をご利用ください。</div>';
 }
 event.target.value="";
}

function saveOcrLevels(){
 const ns=[...document.querySelectorAll(".ocr-name")], ls=[...document.querySelectorAll(".ocr-level")];
 let saved=0, skipped=0;
 ns.forEach((el,i)=>{
   const name=el.value.trim(), level=Number(ls[i].value);
   if(!name||!level){skipped++;return}
   let owned=db.swords.filter(s=>s.name===name);
   let sword=owned.length===1?owned[0]:null;
   if(!sword){
     // If not registered, create a new individual so the screenshot is not lost.
     sword={id:crypto.randomUUID(),name,acquired:today(),startLevel:level,method:"その他",note:"Lvスクショから登録",favorite:false};

   }
   db.levels=db.levels.filter(x=>!(x.swordId===sword.id&&x.date===today()));
   db.levels.push({id:crypto.randomUUID(),swordId:sword.id,date:today(),level,note:"スクショから読み取り"});
   saved++;
 });
 save(); showPage("swords");
 if(skipped) setTimeout(()=>alert(`${saved}件を保存しました。読み取れなかった行はスキップしました。`),100);
}
function renderDaily(){
 const dates=[...new Set([...db.resources.map(x=>x.date),...db.levels.map(x=>x.date)])].sort().reverse();
 document.getElementById("daily").innerHTML=`<div><h1 style="font-family:'Hiragino Mincho ProN','Yu Mincho',serif;font-size:23px;margin:0">日別記録</h1><div class="muted">その日の資材とLvUPをまとめて確認。</div></div>
 <div class="list" style="margin-top:12px">${dates.length?dates.map(d=>dailyCard(d)).join(""):'<div class="empty">まだ日別記録がありません。</div>'}</div>`;
}
function dailyCard(d){
 const r=db.resources.find(x=>x.date===d), ls=db.levels.filter(x=>x.date===d);
 return `<div class="card"><div class="row"><h2>${esc(d)}</h2><span class="muted">${ls.length} Lv記録</span></div>${r?resourceCards(r,resDelta(r,latestResBefore(d))):""}${ls.length?`<div style="margin-top:12px">${ls.map(x=>`<div class="item" style="margin-top:6px"><div class="row"><b>${esc(swordName(x.swordId))}</b><span>Lv.${x.level}</span></div>${x.note?`<div class="muted">${esc(x.note)}</div>`:""}</div>`).join("")}</div>`:""}</div>`
}
function renderSettings(){
 document.getElementById("settings").innerHTML=`<div><h1 style="font-family:'Hiragino Mincho ProN','Yu Mincho',serif;font-size:23px;margin:0">その他</h1><div class="muted">データを守りながら、あとから機能を増やせる構造。</div></div>
 <div class="card"><h2>データ管理</h2><button class="btn full" onclick="exportData()">JSONでバックアップ</button><div style="height:8px"></div><label class="btn secondary full" style="display:block;text-align:center">JSONを復元<input type="file" accept=".json,application/json" onchange="importData(event)" style="display:none"></label><p class="notice">記録はこのiPhoneのブラウザ内に保存されます。機種変更・Safariデータ削除に備えて、定期的にバックアップしてください。</p></div>
 <div class="card"><h2>刀帳データ</h2><p class="notice">現在の実装済み刀剣男士128振りを初期登録しています。新実装の男士は「＋追加」から名前を入力して追加できます。</p></div><div class="card"><h2>これから追加できる機能</h2><span class="pill">8-2周回</span><span class="pill">周回数</span><span class="pill">経験値</span><span class="pill">極記録</span><span class="pill">修行日</span><span class="pill">CSV出力</span><span class="pill">資材グラフ強化</span><span class="pill">テーマ変更</span></div>
 <div class="card"><h2>データを初期化</h2><button class="btn danger full" onclick="resetAll()">すべての記録を削除</button></div>`;
}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`刀帳日記_backup_${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.resources||!x.swords||!x.levels)throw 0;db=x;save();alert("復元しました。")}catch(_){alert("このバックアップは読み込めません。")}};r.readAsText(f)}
function resetAll(){if(confirm("すべての記録を削除します。バックアップはありますか？")){db={...empty};save()}}
function showPage(p){currentPage=p;document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(p).classList.add("active");document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.page===p));renderAll();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function renderAll(){renderHome();renderResources();renderSwords();renderDaily();renderSettings();document.getElementById(currentPage).classList.add("active")}
if("serviceWorker" in navigator){
 window.addEventListener("load",async()=>{
   try{
     const reg=await navigator.serviceWorker.register("sw.js?v=15",{updateViaCache:"none"});
     if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
     navigator.serviceWorker.addEventListener("controllerchange",()=>{
       if(!window.__swReloaded){window.__swReloaded=true;window.location.reload();}
     });
     reg.update().catch(()=>{});
   }catch(e){}
 });
}
renderAll();
</script>
</body>
</html>
